version: '3.8'

services:
  # n8n Autonomous Workflow Orchestrator
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: apex-sdr-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-ApexEnterprise2026!}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n

  # Baileys / Evolution API WhatsApp Multi-Device Server
  evolution-api:
    image: atendux/evolution-api:v2.1.1
    container_name: apex-sdr-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-apex_evolution_secret_2026}
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://localhost:3000/api/whatsapp/webhook
      - DATABASE_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  n8n_data:
    driver: local
  evolution_instances:
    driver: local
