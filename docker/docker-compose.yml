services:
  # PostgreSQL database for Evolution API
  evolution-postgres:
    image: postgres:15-alpine
    container_name: apex-evolution-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_secret_password_2026
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data

  # Redis for session cache
  evolution-redis:
    image: redis:7-alpine
    container_name: apex-evolution-redis
    restart: unless-stopped

  # Baileys / Evolution API WhatsApp Multi-Device Server
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: apex-sdr-evolution
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=apex_evolution_secret_2026
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_secret_password_2026@evolution-postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_METADATA=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://localhost:3000/api/whatsapp/webhook
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_pg_data:
    driver: local
  evolution_instances:
    driver: local

